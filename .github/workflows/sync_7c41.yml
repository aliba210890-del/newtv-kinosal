name: Обновление единого кинозала

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Скачать единый список фильмов
        shell: python
        run: |
          import urllib.request
          import urllib.parse
          from pathlib import Path

          source_url = "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/FILMS.m3u"
          request = urllib.request.Request(
              source_url,
              headers={"User-Agent": "NewTV-Kinosal-Sync/1.0"}
          )
          raw = urllib.request.urlopen(request, timeout=90).read().decode("utf-8-sig", errors="replace")
          lines = raw.splitlines()

          result = ["#EXTM3U"]
          kept = 0
          i = 0

          # Источник уже является списком фильмов. Все найденные записи
          # помещаются в одну категорию «Фильмы», без жанров и подборок.
          blocked_markers = (
              "group-title=\"INFO\"",
              "group-title=\"ПОСМОТРИ",
              "group-title=\"ANDROID TV",
              "group-title=\"FREE TV",
          )

          while i < len(lines):
              line = lines[i].strip()
              if not line.startswith("#EXTINF:"):
                  i += 1
                  continue

              block = [line]
              j = i + 1
              while j < len(lines) and lines[j].strip().startswith("#"):
                  block.append(lines[j].strip())
                  j += 1

              url = lines[j].strip() if j < len(lines) else ""
              title_line = line
              upper = title_line.upper()
              is_promo = (
                  any(marker in title_line.upper() for marker in blocked_markers)
                  or "ПОСМОТРИ!!!" in upper
                  or "ANDROID TV + FREE TV" in upper
              )
              has_url = bool(url) and not url.startswith("#")

              if has_url and not is_promo:
                  # Удаляем старое group-title и назначаем единственную группу.
                  import re
                  if 'group-title="' in line:
                      line = re.sub(r'group-title="[^"]*"', 'group-title="Фильмы"', line, count=1)
                  else:
                      line = line.replace("#EXTINF:", '#EXTINF:-1 group-title="Фильмы" ', 1)

                  block[0] = line

                  ua = ""
                  for item in block[1:]:
                      if item.lower().startswith("#extvlcopt:http-user-agent="):
                          ua = item.split("=", 1)[1].strip().strip('"')
                          break

                  # Для совместимости с разными IPTV-плеерами сохраняем User-Agent в URL.
                  if ua and "|User-Agent=" not in url:
                      url = url + "|User-Agent=" + urllib.parse.quote(ua, safe="")

                  # ClouDDy-плейлист содержит только заголовок фильма и ссылку.
                  result.append(block[0])
                  result.append(url)
                  kept += 1

              i = j + 1

          if kept == 0:
              raise SystemExit("Источник не вернул фильмы; существующие плейлисты не изменены.")

          playlist = "\n".join(result) + "\n"

          # Все старые адреса плейлистов оставляем рабочими, но содержимое единое.
          for filename in ("kinosal-cloudy.m3u", "index_91c2.m3u", "data_7f3a.m3u"):
              Path(filename).write_text(playlist, encoding="utf-8")

          print(f"Единый каталог обновлён. Фильмов: {kept}")

      - name: Сохранить обновлённые плейлисты
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kinosal-cloudy.m3u index_91c2.m3u data_7f3a.m3u
          git diff --cached --quiet || git commit -m "Единый кинозал: только фильмы"
          git push
