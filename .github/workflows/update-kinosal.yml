name: Обновление кинозала New TV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Скачать и отфильтровать M3U
        shell: python
        run: |
          import urllib.request
          from pathlib import Path

          source_url = "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/FILMS.m3u"
          raw = urllib.request.urlopen(source_url, timeout=60).read().decode("utf-8", errors="replace")
          lines = raw.splitlines()

          allowed_groups = {
              "Фильмы": "Кинозал New TV — Фильмы",
              "Новинки кино": "Кинозал New TV — Новинки",
              "Films_4k": "Кинозал New TV — 4K",
              "4K": "Кинозал New TV — 4K",
          }
          blocked_terms = [
              "INFO", "ИНФОРМАЦИЯ", "ПОСМОТРИ", "ЖИЗНЬ НА НАШЕЙ ПЛАНЕТЕ",
              "КАК ЭТО РАБОТАЕТ", "КАК ЭТО СДЕЛАНО", "НАШИ МУЛЬТФИЛЬМЫ",
              "РАЗРУШИТЕЛИ ЛЕГЕНД", "ТОМ И ДЖЕРРИ", "МУЛЬТ"
          ]

          result = ["#EXTM3U"]
          kept = 0
          i = 0
          while i < len(lines):
              line = lines[i].strip()
              if not line.startswith("#EXTINF:"):
                  i += 1
                  continue

              url = lines[i + 1].strip() if i + 1 < len(lines) else ""
              group = ""
              title = line
              for part in line.split(",", 1)[0].split():
                  pass
              marker = 'group-title="'
              if marker in line:
                  group = line.split(marker, 1)[1].split('"', 1)[0]
              title_upper = line.upper()
              group_upper = group.upper()

              if group in allowed_groups and not any(term in title_upper or term in group_upper for term in blocked_terms):
                  new_line = line
                  if marker in new_line:
                      before, rest = new_line.split(marker, 1)
                      old_group, after = rest.split('"', 1)
                      new_line = before + marker + allowed_groups[group] + '"' + after
                  result.extend([new_line, url])
                  kept += 1
              i += 2

          if kept == 0:
              raise SystemExit("Не найдено ни одного фильма; исходный файл не будет перезаписан.")

          Path("kinosal-new-tv.m3u").write_text("\n".join(result) + "\n", encoding="utf-8")
          print(f"Сохранено фильмов: {kept}")

      - name: Сохранить обновлённый плейлист
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kinosal-new-tv.m3u
          git diff --cached --quiet || git commit -m "Автоматическое обновление кинозала"
          git push
